# XcodeGen: sinh file WarehouseScanner.xcodeproj bang lenh `xcodegen generate`
name: WarehouseScanner
options:
  bundleIdPrefix: com.wh
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated     # callback camera chay ngoai main thread
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4A2CPW6M9J     # Team của công ty
targets:
  WarehouseScanner:
    type: application
    platform: iOS
    sources:
      - path: WarehouseScanner
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Warehouse Tina
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Ứng dụng dùng camera để quét mã vạch và đọc mã kho trên nhãn hàng.
        NSPhotoLibraryUsageDescription: Chọn ảnh nhãn hoặc ảnh hàng hỏng để gửi lên công ty.
        ITSAppUsesNonExemptEncryption: false     # chỉ dùng HTTPS của hệ thống (miễn khai báo mã hóa)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wh.internal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
